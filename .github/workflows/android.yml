# This is a basic workflow to help you get started with Actions

name: CI

# This workflow is triggered when push to master, develop or push any branch with tag
on: [push, pull_request]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # 1. Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Sets up the JDK version (e.g., 17) required for your Android project
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: x64

      - name: Create assets directory debug
        run: mkdir -p app/src/debug

      - name: Decode and create JSON Dev file
        # This step decodes the Base64 secret and writes it to your app's assets folder.
        env:
          JSON_SECRET: ${{ secrets.FIREBASE_DEV }}
        run: echo $JSON_SECRET | base64 -d > app/src/debug/google-services.json
        # Use the correct path for your project. If it's for google-services.json, the path is `app/google-services.json`.

      - name: Create assets directory stage
        run: mkdir -p app/src/stage

      - name: Decode and create JSON Stage file
        # This step decodes the Base64 secret and writes it to your app's assets folder.
        env:
          JSON_SECRET: ${{ secrets.FIREBASE_STAGE }}
        run: echo $JSON_SECRET | base64 -d > app/src/stage/google-services.json
        # Use the correct path for your project. If it's for google-services.json, the path is `app/google-services.json`.

      - name: Create assets directory release
        run: mkdir -p app/src/release

      - name: Decode and create JSON Release file
        # This step decodes the Base64 secret and writes it to your app's assets folder.
        env:
          JSON_SECRET: ${{ secrets.FIREBASE_PROD }}
        run: echo $JSON_SECRET | base64 -d > app/src/release/google-services.json
        # Use the correct path for your project. If it's for google-services.json, the path is `app/google-services.json`.

      - name: Grant permissions for ./gradlew
        run: chmod +x ./gradlew

      - name: Clean dependencies
        run: ./gradlew clean androidDependencies

      - name: Check code formatting
        run: ./gradlew check

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest